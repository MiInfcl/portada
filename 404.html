<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No está · Taller</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f3ec">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,800&display=swap">
<style>
:root {
  --papel: #f6f3ec;
  --tinta: #1d1a16;
  --tinta-2: #5f584e;
  --linea: #e2dccf;
  --sombra-1: 0 1px 2px rgba(60, 44, 24, .08), 0 10px 24px -10px rgba(60, 44, 24, .22);
  --sombra-2: 0 2px 4px rgba(60, 44, 24, .08), 0 22px 40px -14px rgba(60, 44, 24, .32);
  --salida: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--papel);
  color: var(--tinta);
  font: 16px/1.5 "Bricolage Grotesque", system-ui, sans-serif;
}
::selection { background: var(--tinta); color: var(--papel); }
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--tinta); outline-offset: 4px; border-radius: 4px; }

.top { padding: 28px 20px 0; text-align: center; }
.marca {
  display: inline-flex; align-items: baseline;
  font-weight: 800; font-size: 30px; letter-spacing: -0.045em; line-height: 1;
  text-decoration: none;
}
.marca svg { width: .26em; height: .34em; margin: 0 .04em 0 .06em; fill: var(--tinta); }

main {
  flex: 1;
  width: 100%; max-width: 820px;
  margin: 0 auto;
  padding: 24px 20px 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
}

.escena { width: 100%; height: auto; display: block; overflow: visible; }
.escena .trazo { fill: none; stroke: var(--tinta); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.escena .cifra { font: 800 132px/1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.04em; fill: var(--tinta); }
.escena .duda { font: 800 40px/1 "Bricolage Grotesque", system-ui, sans-serif; fill: var(--tinta); }

/* El suelo se dibuja de una vez, como un trazo de pluma */
.suelo { stroke-dasharray: 1; stroke-dashoffset: 1; animation: dibujar 1.3s var(--salida) .1s forwards; }
@keyframes dibujar { to { stroke-dashoffset: 0; } }

/* La gota se asoma al hoyo: las patas quedan fijas, el cuerpo se inclina, mira, vuelve y duda */
.cuerpo-gota { transform-box: view-box; transform-origin: 575px 156px; animation: asomarse 6s cubic-bezier(.45, 0, .2, 1) 1.4s infinite; }
@keyframes asomarse {
  0%, 18% { transform: rotate(0deg); }
  30%, 52% { transform: rotate(-11deg); }
  64%, 100% { transform: rotate(0deg); }
}
.ojo { transform-box: fill-box; transform-origin: center; animation: parpadeo 6s linear 1.4s infinite; }
@keyframes parpadeo {
  0%, 40%, 44%, 100% { transform: scaleY(1); }
  42% { transform: scaleY(.1); }
}
.duda { opacity: 0; transform-box: fill-box; transform-origin: 30% 100%; animation: duda 6s var(--salida) 1.4s infinite; }
@keyframes duda {
  0%, 62% { opacity: 0; transform: translateY(6px) scale(.6) rotate(0); }
  68% { opacity: 1; transform: translateY(-4px) scale(1.08) rotate(-8deg); }
  74%, 92% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
  100% { opacity: 0; transform: translateY(0) scale(1); }
}

h1 {
  margin: 34px 0 0;
  font-weight: 800;
  font-size: clamp(36px, 7vw, 60px);
  line-height: 1;
  letter-spacing: -0.04em;
  text-wrap: balance;
}
.bajada { margin: 16px auto 0; max-width: 30em; color: var(--tinta-2); font-size: 18px; text-wrap: pretty; }

.volver {
  margin-top: 30px;
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 22px 14px 18px;
  background: var(--tinta); color: var(--papel);
  border-radius: 4px;
  box-shadow: var(--sombra-1);
  font-weight: 500; font-size: 17px; text-decoration: none;
  transition: transform .22s cubic-bezier(.3, 1.6, .5, 1), box-shadow .22s;
}
.volver svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .22s var(--salida); }
.volver:hover, .volver:focus-visible { transform: translateY(-3px) rotate(-1.2deg); box-shadow: var(--sombra-2); }
.volver:hover svg, .volver:focus-visible svg { transform: translateX(-3px); }
.volver:active { transform: translateY(1px); box-shadow: var(--sombra-1); transition-duration: .06s; }

@media (max-width: 560px) {
  .top { padding-top: 22px; }
  .marca { font-size: 26px; }
  main { padding-top: 8px; overflow-x: clip; }
  .escena { width: 126%; max-width: none; margin-inline: -13%; }
  h1 { margin-top: 26px; }
  .bajada { font-size: 17px; }
}

@media (prefers-reduced-motion: reduce) {
  .suelo { animation: none; stroke-dashoffset: 0; }
  .cuerpo-gota, .ojo { animation: none; }
  .duda { animation: none; opacity: 1; }
}
</style>
</head>
<body>

<header class="top">
  <a class="marca" href="/" aria-label="taller.ink, volver a la portada">
    <span>taller</span><svg viewBox="0 0 32 40" aria-hidden="true"><path d="M16 2S4 18 4 26a12 12 0 0 0 24 0C28 18 16 2 16 2z"/></svg><span>ink</span>
  </a>
</header>

<main>
  <svg class="escena" viewBox="0 0 720 250" role="img" aria-label="Un 404 escrito sobre una línea de tinta y una gota que se asoma a un charco de tinta">
    <!-- suelo: una sola línea que se corta en el 404 y en el hoyo -->
    <path class="trazo suelo" pathLength="1" d="M8 200H84M338 200H392M540 200H712"/>
    <text class="cifra" x="211" y="200" text-anchor="middle">404</text>

    <!-- el hoyo de tinta -->
    <ellipse cx="466" cy="201" rx="70" ry="13" fill="#1d1a16"/>

    <!-- la gota que busca la página -->
    <g class="gota-personaje">
      <path class="trazo" d="M566 160l-2 38M584 150l8 48"/>
      <g class="cuerpo-gota">
        <g transform="translate(540 136) rotate(52)">
          <path d="M0-80S-40-28-40 0a40 40 0 0 0 80 0C40-28 0-80 0-80z" fill="#f6f3ec" stroke="#1d1a16" stroke-width="4" stroke-linejoin="round"/>
        </g>
        <circle class="ojo" cx="520" cy="158" r="4.5" fill="#1d1a16"/>
        <ellipse cx="534" cy="171" rx="4" ry="5" fill="none" stroke="#1d1a16" stroke-width="3"/>
      </g>
    </g>
    <text class="duda" x="602" y="66">?!</text>
  </svg>

  <h1>Aquí se acabó la tinta</h1>
  <p class="bajada">La página que buscas no existe o cambió de lugar. Todo lo que sale del taller está en la portada.</p>
  <a class="volver" href="/">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5"/></svg>
    Volver al taller
  </a>
</main>

</body>
</html>
